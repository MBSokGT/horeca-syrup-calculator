<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Калькулятор порции</title><style>:root{color-scheme:light;--red:#b91924;--ink:#242527;--muted:#62656a;--line:#ded8d0;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:#fff}
*{box-sizing:border-box}
body{margin:0;background:#fff;font-size:16px;line-height:1.5}
.calculator-widget{max-width:1120px;margin:auto;padding:24px 28px}
.calculator h3{font-size:clamp(25px,3vw,34px);line-height:1.2;margin:0 0 26px;font-weight:700;letter-spacing:-.02em}
.calc-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.calc-grid fieldset{min-width:0;margin:0;border:1px solid var(--line);padding:14px 18px 18px}
.calc-grid legend{padding:0 7px;color:var(--red);font-size:19px;font-weight:700}
.calc-grid label{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0;font-size:15px}
input{font:inherit;color:var(--ink);border:1px solid #bcb8b3;border-radius:0;background:#fff;padding:10px 11px;min-width:0}
.calc-grid input{width:110px;max-width:48%}
input:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.calc-context{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:20px 0}
.calc-context label{display:block;margin:0;font-size:14px}
.calc-context input{display:block;width:100%;max-width:none;margin-top:8px}
.calc-result{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);margin-top:22px}
.calc-result>div{padding:16px 18px;border-right:1px solid var(--line)}
.calc-result>div:last-child{border-right:0}
.calc-result small{display:block;font-size:13px;line-height:1.45;color:var(--muted)}
.calc-result strong{display:block;margin-top:7px;font-size:30px;line-height:1.25;font-weight:700;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.calc-costs{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:12px}
.calc-costs strong{font-size:25px}
.calc-error{font-size:14px;color:var(--red);margin:16px 0 0}
[hidden]{display:none!important}
@media(max-width:700px){.calculator-widget{padding:20px}.calc-context{grid-template-columns:repeat(2,minmax(0,1fr))}.calc-grid{gap:14px}.calc-grid label{font-size:14px}.calc-grid fieldset{padding:10px 12px 14px}.calc-result>div{padding:13px}.calc-result strong{font-size:26px}}
@media(max-width:500px){.calc-grid:not(.calc-context){grid-template-columns:1fr}.calc-result{grid-template-columns:1fr}.calc-result>div{border-right:0;border-bottom:1px solid var(--line)}.calc-result>div:last-child{border-bottom:0}.calc-result strong{font-size:28px}.calc-result small{font-size:13px}.calculator-widget{padding:18px}.calculator h3{font-size:26px;margin-bottom:20px}}
</style></head>
<body><main class="calculator-widget">
<div class="calculator" id="syrupCalculator"><h3>Калькулятор порции</h3>
    <div class="calc-grid"><fieldset><legend>Наш сироп</legend><label>Цена бутылки, ₽ <input id="newPrice" type="number" min="0" step="0.01" value="520" inputmode="decimal"></label><label>Объём, мл <input id="newVolume" type="number" min="1" step="1" value="1000" inputmode="numeric"></label><label>На порцию, мл <input id="newDose" type="number" min="0.1" step="0.1" value="25" inputmode="decimal"></label></fieldset><fieldset><legend>Другой сироп</legend><label>Цена бутылки, ₽ <input id="oldPrice" type="number" min="0" step="0.01" value="560" inputmode="decimal"></label><label>Объём, мл <input id="oldVolume" type="number" min="1" step="1" value="1000" inputmode="numeric"></label><label>На порцию, мл <input id="oldDose" type="number" min="0.1" step="0.1" value="25" inputmode="decimal"></label></fieldset></div>
    <div class="calc-grid calc-context"><label>Напитков в месяц <input id="monthlyServings" type="number" min="0" step="1" value="300" inputmode="numeric"></label><label>Цена напитка, ₽ <input id="drinkPrice" type="number" min="0.01" step="0.01" value="250" inputmode="decimal"></label><label>Остальные ингредиенты, ₽ <input id="otherCost" type="number" min="0" step="0.01" value="57" inputmode="decimal"></label><label>Потери на напиток, ₽ <input id="wasteCost" type="number" min="0" step="0.01" value="5" inputmode="decimal"></label></div>
    <div class="calc-result" aria-live="polite"><div><small>Наш сироп / порция</small><strong id="newUnitCost">13 ₽</strong></div><div><small>Другой сироп / порция</small><strong id="oldUnitCost">14 ₽</strong></div><div><small>Разница за месяц</small><strong id="monthlyDifference">300 ₽</strong></div></div><div class="calc-result calc-costs" aria-live="polite"><div><small>С нашим сиропом: ингредиенты и потери / напиток</small><strong id="ingredientsCost">75 ₽</strong></div><div><small>Доля этих затрат в цене напитка</small><strong id="ingredientsShare">30%</strong></div></div><p id="calculatorError" class="calc-error" role="status" hidden></p>
  </div></main><script>const calculator = document.getElementById('syrupCalculator');
if (calculator) {
  const ids = ['newPrice', 'newVolume', 'newDose', 'oldPrice', 'oldVolume', 'oldDose', 'monthlyServings', 'drinkPrice', 'otherCost', 'wasteCost'];
  const inputs = Object.fromEntries(ids.map(id => [id, document.getElementById(id)]));
  const money = value => {
    const rounded = Math.round((value + Number.EPSILON) * 100) / 100;
    return new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 2, minimumFractionDigits: Number.isInteger(rounded) ? 0 : 2}).format(rounded) + ' ₽';
  };
  function calculate() {
    const value = Object.fromEntries(ids.map(id => [id, Number(String(inputs[id].value).replace(',', '.'))]));
    const invalid = ids.some(id => inputs[id].value.trim() === '' || !Number.isFinite(value[id]) || value[id] < 0)
      || value.newVolume <= 0 || value.oldVolume <= 0 || value.newDose <= 0 || value.oldDose <= 0 || value.drinkPrice <= 0;
    const error = document.getElementById('calculatorError');
    if (invalid) {
      ['newUnitCost', 'oldUnitCost', 'monthlyDifference', 'ingredientsCost', 'ingredientsShare'].forEach(id => document.getElementById(id).textContent = '—');
      error.textContent = 'Введите объём, дозировку и цену напитка больше нуля. Остальные значения могут быть нулевыми.';
      error.hidden = false;
      return;
    }
    error.hidden = true;
    error.textContent = '';
    const newCost = value.newPrice * value.newDose / value.newVolume;
    const oldCost = value.oldPrice * value.oldDose / value.oldVolume;
    const difference = (oldCost - newCost) * value.monthlyServings;
    const foodCost = newCost + value.otherCost + value.wasteCost;
    document.getElementById('newUnitCost').textContent = money(newCost);
    document.getElementById('oldUnitCost').textContent = money(oldCost);
    document.getElementById('monthlyDifference').textContent = (difference < -0.005 ? '−' : difference > 0.005 ? '+' : '') + money(Math.abs(difference));
    document.getElementById('ingredientsCost').textContent = money(foodCost);
    document.getElementById('ingredientsShare').textContent = new Intl.NumberFormat('ru-RU', {maximumFractionDigits: 1}).format(foodCost / value.drinkPrice * 100) + '%';
  }
  Object.values(inputs).forEach(input => input.addEventListener('input', calculate));
  calculate();
}

</script></body></html>
